# Production overlay: Traefik reverse proxy + automatic Let's Encrypt HTTPS.
# Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Requires in the root .env:
#   DOMAIN      - base domain (default: sellevate.site). Routes DOMAIN -> frontend,
#                 api.DOMAIN -> gateway, grafana.DOMAIN -> Grafana.
#   ACME_EMAIL  - email for Let's Encrypt notifications
#   FRONTEND_URL=https://<DOMAIN>  (backend CORS allow-list)
# DNS A records for $DOMAIN and *.$DOMAIN must point to this server,
# and ports 80 + 443 must be open in the firewall.

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt via HTTP-01 challenge
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    depends_on:
      - frontend
      - gateway

  frontend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-sellevate.site}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  # api.DOMAIN -> the YARP gateway, the single public API entry point. The monolith
  # is retired; the gateway routes every path to its owning microservice.
  gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.${DOMAIN:-sellevate.site}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=le"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

  # T-2 (docs/AUDIT_TENANCY.md): the base compose file sets ASPNETCORE_ENVIRONMENT=Development
  # for every .NET service so `scripts/dev-*.sh` gets hot-reload/Swagger locally. This overlay
  # overrides it back to Production for the prod shape only, so InternalServiceAuthFilter
  # fails closed instead of no-op'ing when INTERNAL_SERVICE_SECRET is empty, POST /demo/token
  # 404s, and Swagger stays closed. docker compose merges same-key environment entries with
  # last-file-wins, so this line wins over the base file's Development value.
  identity:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  ai:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  analytics:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  notification:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  gamification:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  social:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  learning:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  company:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  organization:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  # Grafana published at https://grafana.${DOMAIN}. Protected by Grafana's own
  # login (anonymous disabled, signup disabled) — set a strong GRAFANA_ADMIN_PASSWORD
  # in the root .env. ROOT_URL is needed so Grafana builds correct absolute links
  # behind the TLS-terminating proxy.
  grafana:
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN:-sellevate.site}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN:-sellevate.site}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=le"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

volumes:
  letsencrypt:
